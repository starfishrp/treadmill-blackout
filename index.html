<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blackout">
<meta name="theme-color" content="#0F6E56">
<title>Treadmill Blackout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --green: #1D9E75;
    --green-dark: #0F6E56;
    --bg: #f8f8f6;
    --surface: #ffffff;
    --text: #1a1a18;
    --text-2: #666660;
    --border: rgba(0,0,0,0.1);
    --cell: 28px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #2a2a28;
      --text: #f0efe8;
      --text-2: #999990;
      --border: rgba(255,255,255,0.12);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  header {
    background: var(--green-dark);
    color: white;
    padding: 14px 16px 10px;
    padding-top: calc(14px + env(safe-area-inset-top));
  }

  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  header p { font-size: 11px; opacity: 0.72; margin-top: 2px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 10px 10px 0;
  }

  .stat {
    background: var(--surface);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }

  .stat-value { font-size: 18px; font-weight: 600; color: var(--green-dark); }
  @media (prefers-color-scheme: dark) { .stat-value { color: var(--green); } }
  .stat-label { font-size: 10px; color: var(--text-2); margin-top: 1px; }

  .progress-bar-wrap { padding: 8px 10px 0; }
  .progress-bar-bg { background: var(--border); border-radius: 99px; height: 5px; overflow: hidden; }
  .progress-bar-fill { background: var(--green); height: 100%; border-radius: 99px; transition: width 0.3s; width: 0%; }

  .grid-section {
    padding: 12px 10px 10px;
    flex: 1;
    display: flex;
    align-items: flex-start;
  }

  /* y-axis writing-mode label */
  .y-axis-title {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px;
    color: var(--text-2);
    font-weight: 500;
    text-align: center;
    margin-right: 3px;
    flex-shrink: 0;
    align-self: center;
  }

  .grid-main { display: flex; flex-direction: column; flex: 1; }

  /* spacer row to align x-labels with cells (accounts for y-label column) */
  .x-labels { display: flex; margin-bottom: 3px; }
  .x-label {
    width: var(--cell);
    font-size: 10px;
    color: var(--text-2);
    text-align: center;
    margin-right: 2px;
    flex-shrink: 0;
  }

  .grid-body { display: flex; }

  .y-labels { display: flex; flex-direction: column; margin-right: 3px; }
  .y-label {
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: 10px;
    color: var(--text-2);
    margin-bottom: 2px;
    width: 26px;
    flex-shrink: 0;
  }

  .grid-rows { display: flex; flex-direction: column; }
  .grid-row { display: flex; margin-bottom: 2px; }

  .cell {
    width: var(--cell);
    height: var(--cell);
    border-radius: 5px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    margin-right: 2px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
    -webkit-user-select: none;
    user-select: none;
  }

  .cell:active { transform: scale(0.82); }

  .cell.done {
    background: var(--green);
    border-color: var(--green-dark);
  }

  .cell.done::after {
    content: '✓';
    color: white;
    font-size: 13px;
    font-weight: 700;
  }

  .x-axis-label {
    text-align: center;
    font-size: 10px;
    color: var(--text-2);
    font-weight: 500;
    margin-top: 4px;
    /* indent to align with cells, not y-labels */
    padding-left: 29px;
  }

  .legend {
    display: flex;
    gap: 14px;
    padding: 0 10px 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .swatch-done { background: var(--green); }
  .swatch-empty { background: var(--surface); border: 1.5px solid var(--border); }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: rgba(15,110,86,0.95);
    color: white;
    padding: 7px 18px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.18s, transform 0.18s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>Treadmill blackout</h1>
  <p>Run 1 km at every speed × incline combination</p>
</header>

<div class="stats">
  <div class="stat"><div class="stat-value" id="stat-done">0</div><div class="stat-label">Done</div></div>
  <div class="stat"><div class="stat-value" id="stat-rem">120</div><div class="stat-label">Left</div></div>
  <div class="stat"><div class="stat-value" id="stat-pct">0%</div><div class="stat-label">Progress</div></div>
  <div class="stat"><div class="stat-value" id="stat-elev">0</div><div class="stat-label">m climb</div></div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
</div>

<div class="grid-section">
  <div class="y-axis-title">Incline (%)</div>
  <div class="grid-main">
    <div class="x-labels" id="x-labels"></div>
    <div class="grid-body">
      <div class="y-labels" id="y-labels"></div>
      <div class="grid-rows" id="grid-rows"></div>
    </div>
    <div class="x-axis-label">Speed (km/h)</div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="swatch swatch-done"></div>Done</div>
  <div class="legend-item"><div class="swatch swatch-empty"></div>Not yet</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SPEEDS   = [4, 6, 8, 10, 12, 14, 15, 16, 17, 18];
const INCLINES = [18, 17, 16, 12, 11, 10, 6, 5, 4, 0, -1, -2];
const TOTAL    = SPEEDS.length * INCLINES.length; // 120
const KEY      = 'blackout_v3';

let done = new Set();

function load() {
  try { const r = localStorage.getItem(KEY); if (r) done = new Set(JSON.parse(r)); } catch(e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {}
}
function cellKey(s, i) { return s + '_' + i; }

function updateStats() {
  const n = done.size;
  const pct = Math.round(n / TOTAL * 100);
  document.getElementById('stat-done').textContent = n;
  document.getElementById('stat-rem').textContent = TOTAL - n;
  document.getElementById('stat-pct').textContent = pct + '%';
  let elev = 0;
  done.forEach(k => {
    const inc = parseFloat(k.split('_')[1]);
    if (inc > 0) elev += inc / 100 * 1000;
  });
  document.getElementById('stat-elev').textContent = Math.round(elev);
  document.getElementById('progress-bar').style.width = pct + '%';
}

function build() {
  // X labels
  const xLabels = document.getElementById('x-labels');
  xLabels.innerHTML = '';
  // spacer for y-labels column
  const spacer = document.createElement('div');
  spacer.style.width = '29px'; spacer.style.flexShrink = '0';
  xLabels.appendChild(spacer);
  SPEEDS.forEach(s => {
    const l = document.createElement('div');
    l.className = 'x-label';
    l.textContent = s;
    xLabels.appendChild(l);
  });

  // Y labels
  const yLabels = document.getElementById('y-labels');
  yLabels.innerHTML = '';
  INCLINES.forEach(inc => {
    const l = document.createElement('div');
    l.className = 'y-label';
    l.textContent = inc + '%';
    yLabels.appendChild(l);
  });

  // Grid cells
  const gridRows = document.getElementById('grid-rows');
  gridRows.innerHTML = '';
  INCLINES.forEach(inc => {
    const row = document.createElement('div');
    row.className = 'grid-row';
    SPEEDS.forEach(spd => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const key = cellKey(spd, inc);
      if (done.has(key)) cell.classList.add('done');
      cell.setAttribute('aria-label', spd + ' km/h, ' + inc + '% incline');
      cell.addEventListener('click', () => {
        if (done.has(key)) {
          done.delete(key);
          cell.classList.remove('done');
          showToast('Unmarked');
        } else {
          done.add(key);
          cell.classList.add('done');
          showToast('km logged ✓');
        }
        save();
        updateStats();
      });
      row.appendChild(cell);
    });
    gridRows.appendChild(row);
  });

  updateStats();
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

load();
build();
</script>
</body>
</html>
